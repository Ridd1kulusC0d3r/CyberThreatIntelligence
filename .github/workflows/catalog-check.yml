name: Validate CTI and SOC learning resources

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate resource catalog
        run: python3 scripts/validate_catalog.py
      - name: Validate local navigation and curriculum
        run: python3 scripts/validate_learning.py
      - name: Exercise SOC query and negative cases
        run: python3 scripts/run_soc_lab.py
      - name: Exercise collection recovery
        run: python3 scripts/collect_fixture.py --self-test
